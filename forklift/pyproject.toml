[tool.poetry]
name = "forklift"
version = "0.1.0"
description = ""
authors = ["Vincent <vincent.chery@m4x.org>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "3.13.15"
prefect = "~1.4.1"
pandas = {extras = ["postgresql"], version = "^2.3.2"}
duckdb = "^1.5.5"
black = "^26.5.1"
isort = "^8.0.1"
coverage = "^7.15.4"
pre-commit = "^4.5.1"
flake8 = "^7.3.0"
python-dotenv = "^1.2.2"
pytest = "^9.1.1"
geopandas = "^1.1.4"
simplejson = "^3.20.2"
geoalchemy2 = "^0.20.0"
clickhouse-connect = ">=0.14.1,<0.16.0"
h3 = "^4.5.0"
unidecode = "^1.4.0"
tornado = "^6.5.7"
requests = "^2.34.2"
marshmallow = "<4"


[tool.poetry.group.dev.dependencies]
jupyter = "^1.1.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"

[tool.coverage.run]
source = ['forklift']